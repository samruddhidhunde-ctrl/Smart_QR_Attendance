
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance - SamruddhiAttendX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 25px #00000015;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #1677d2;
            font-size: 28px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            background: #168cf0;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
        }

        button:hover {
            background: #086dc4;
        }

        .message {
            margin-top: 18px;
            font-weight: bold;
            color: #167c3a;
        }

        .error {
            color: #c62828;
        }

        a {
            display: inline-block;
            margin-top: 22px;
            color: #168cf0;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Attendance</h1>
        <p><strong>SamruddhiAttendX</strong></p>

        {% if subject %}
            <p>Subject: <strong>{{ subject }}</strong></p>
        {% endif %}

        {% if valid %}
            <form method="POST" action="{{ url_for('student', token=token) }}">
                <input type="hidden" name="token" value="{{ token }}">

                <input
                    type="text"
                    name="student_name"
                    placeholder="Enter your full name"
                    required
                >

                <input
                    type="text"
                    name="student_id"
                    placeholder="Enter your Student ID"
                    required
                >

                <button type="submit">Submit Attendance</button>
            </form>
        {% else %}
            <p>Scan the latest QR code generated by your teacher.</p>
        {% endif %}

        {% if message %}
            <p class="message {% if 'invalid' in message|lower or 'expired' in message|lower or 'already' in message|lower or 'enter' in message|lower %}error{% endif %}">
                {{ message }}
            </p>
        {% endif %}

        <a href="{{ url_for('home') }}">← Back to Home</a>
    </div>
</body>
</html>
