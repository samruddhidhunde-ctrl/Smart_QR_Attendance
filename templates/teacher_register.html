
<!DOCTYPE html>
<html>
<head>
    <title>Teacher Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 4px 15px #0002;
        }
        h2 { text-align: center; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #2457d6;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .message {
            color: red;
            text-align: center;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Teacher Account</h2>

        {% if error %}
            <p class="message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('teacher_register') }}" method="POST">
            <input
                type="text"
                name="teacher_name"
                placeholder="Enter Full Name"
                required
            >

            <input
                type="text"
                name="username"
                placeholder="Create Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password (minimum 8 characters)"
                minlength="8"
                required
            >

            <button type="submit">Create Teacher Account</button>
        </form>

        <a href="{{ url_for('teacher') }}">Back to Login</a>
    </div>
</body>
</html>
