
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamruddhiAttendX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5fc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 25px #00000015;
            box-sizing: border-box;
        }

        h1 {
            color: #1677d2;
            font-size: 30px;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: block;
            background: #168cf0;
            color: white;
            padding: 14px;
            margin-top: 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        a.secondary {
            background: #176b45;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>SamruddhiAttendX</h1>
        <p>Smart QR-Based Attendance System</p>
        <p>Register students, generate QR codes, and record attendance.</p>

        <a href="{{ url_for('register') }}">Student Registration</a>
        <a href="{{ url_for('teacher') }}" class="secondary">Teacher Login</a>
    </div>
</body>
</html>
