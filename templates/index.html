<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SamruddhiAttendX</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f7fb;
            padding: 60px 15px;
        }

        .box {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { color: #222; }
        p { color: #555; font-size: 18px; }

        button {
            padding: 12px 22px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            color: white;
        }

        .teacher { background: #4CAF50; }
        .student { background: #2196F3; }
    </style>
</head>

<body>
    <div class="box">
        <h1>SamruddhiAttendX</h1>
        <p>Smart QR-Based Attendance System</p>
        <p>Attendance made simple and digital.</p>

        <button class="teacher">Teacher Login</button>
        <button class="student">Student Login</button>
    </div>
</body>
</html>
