
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - SamruddhiAttendX</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5fc;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px #00000015;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: #1677d2;
        }

        p {
            color: #555;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #168cf0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .success {
            margin-top: 20px;
            padding: 15px;
            background: #e8f7ed;
            border-radius: 8px;
            color: #176b35;
            overflow-wrap: anywhere;
        }

        .student-id {
            font-size: 26px;
            font-weight: bold;
            margin: 12px 0;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            color: #1677d2;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Student Registration</h1>
        <p>SamruddhiAttendX Smart QR-Based Attendance System</p>
        <p>Register to receive your unique Student ID.</p>

        <form method="POST" action="{{ url_for('register') }}">
            <input
                type="text"
                name="student_name"
                placeholder="Enter your full name"
                maxlength="100"
                required
            >
            <button type="submit">Register Student</button>
        </form>

        {% if assigned_id %}
            <div class="success">
                <p>{{ message }}</p>
                <div class="student-id">{{ assigned_id }}</div>
                <p>Please save your Student ID for marking attendance.</p>
            </div>
        {% elif message %}
            <p>{{ message }}</p>
        {% endif %}

        <a href="{{ url_for('home') }}">Back to Home</a>
    </div>
</body>
</html>
