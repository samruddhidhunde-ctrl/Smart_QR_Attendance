
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000015;
        }
        h1 {
            text-align: center;
            color: #2563eb;
        }
        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 14px;
            border-radius: 7px;
            font-size: 16px;
        }
        input {
            border: 1px solid #cbd5e1;
        }
        button {
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }
        .error { color: #dc2626; }
        .success { color: #15803d; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>SamruddhiAttendX</h1>
        <h2>Teacher Registration</h2>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        {% if success %}
        <p class="success">{{ success }}</p>
        <a href="{{ url_for('teacher') }}">Go to Teacher Login</a>
        {% else %}
        <form method="POST">
            <input
                type="text"
                name="teacher_name"
                placeholder="Full Name"
                required
            >

            <input
                type="text"
                name="username"
                placeholder="Create Username"
                minlength="4"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Create Password (minimum 8 characters)"
                minlength="8"
                required
            >

            <button type="submit">Create Teacher Account</button>
        </form>

        <p>Already registered?
            <a href="{{ url_for('teacher') }}">Login here</a>
        </p>
        {% endif %}
    </div>
</body>
</html>
